    <!-- Central Spine Vein -->
    <line x1="24" y1="3" x2="24" y2="48" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />

    <!-- Leaf Vein Accents - Left Side -->
    <line x1="24" y1="26" x2="15" y2="29" stroke="#b47e00" stroke-width="0.9" opacity="0.85" />
    <line x1="24" y1="20" x2="17" y2="22" stroke="#b47e00" stroke-width="0.9" opacity="0.85" />
    <line x1="24" y1="14" x2="20" y2="15" stroke="#b47e00" stroke-width="0.9" opacity="0.85" />

    <!-- Leaf Vein Accents - Right Side -->
