    <line x1="24" y1="20" x2="31" y2="22" stroke="#0c2340" stroke-width="0.9" opacity="0.75" />
    <line x1="24" y1="14" x2="28" y2="15" stroke="#0c2340" stroke-width="0.9" opacity="0.75" />

