<svg width="512" height="512" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mapleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dda82e" />
      <stop offset="100%" stop-color="#b47e00" />
    </linearGradient>
  </defs>

  <g transform="translate(2, 1)">
    <!-- Left facet of Maple Leaf (Navy #0c2340) -->
    <path
      d="M 24,3 L 22.6,11.2 L 18.2,10.2 L 20.8,15.8 L 13.4,17.2 L 17.8,22.4 L 6.4,25.4 L 15.2,29.8 L 12.4,35.4 L 20.6,33.4 L 22.8,42.2 L 22.8,48 L 24,48 Z"
