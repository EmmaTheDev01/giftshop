    />

    <!-- Right facet of Maple Leaf (Artisan Gold) -->
    <path
      d="M 24,3 L 25.4,11.2 L 29.8,10.2 L 27.2,15.8 L 34.6,17.2 L 30.2,22.4 L 41.6,25.4 L 32.8,29.8 L 35.6,35.4 L 27.4,33.4 L 25.2,42.2 L 25.2,48 L 24,48 Z"
